{% extends "base.html" %}

{% block title %}Edit Contact{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Contact</h1>
        <p class="page-subtitle">Changes apply to future shipments only</p>
    </div>
    <a href="/shipping-contacts" class="btn btn-secondary">Cancel</a>
</div>

<div class="table-container" style="padding:24px;max-width:560px;">
    <form method="POST" action="/shipping-contacts/{{ contact.contact_id }}/update" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name">Buyer name</label>
            <input type="text" id="name" name="name" value="{{ contact.name }}" required>
        </div>
        <div class="form-group">
            <label for="contact_info">Contact info</label>
            <input type="text" id="contact_info" name="contact_info" value="{{ contact.contact_info or '' }}" placeholder="Phone, email…">
        </div>
        <div class="form-group">
            <label for="destination">Destination / address</label>
            <input type="text" id="destination" name="destination" value="{{ contact.destination or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Contact</button>
    </form>
</div>

{% endblock %}
